<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vikash Mart - Admin Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="admin-body">
<main class="admin-login">
  <a class="brand admin-brand" href="{{ url_for('home') }}">Vik<span>Mart</span></a>
  <div class="admin-card">
    <p class="eyebrow">ADMIN PANEL</p><h1>Admin Login</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" class="form-card">
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn dark full" type="submit">Login</button>
    </form>
  </div>
</main></body></html>
