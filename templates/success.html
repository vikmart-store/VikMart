<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Confirmed - Vikash Mart</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<main class="success">
  <div class="check">✓</div><p class="eyebrow">ORDER CONFIRMED</p><h1>Thank you, {{ name }}!</h1>
  <p>Your order has been placed successfully.</p>
  <div class="order-box"><span>Order ID</span><strong>#{{ order_id }}</strong><span>Total</span><strong>₹{{ '%.0f'|format(total) }}</strong></div>
  <a class="btn dark" href="{{ url_for('home') }}">Continue shopping</a>
</main>
</body></html>
